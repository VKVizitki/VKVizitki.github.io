<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Джахангир Туганбай — аналитик и автоматизация отчётов</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;700&family=Onest:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#E8EEF4;--ink:#10243E;--muted:#4F6177;--sky:#0095B3;--sun:#FEC50C;--paper:#FFFFFF;--line:#C9D5E1;--btn:#10243E;--btn-ink:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0C1827;--ink:#E6EEF6;--muted:#97A9BC;--sky:#2BC3E0;--paper:#16273B;--line:#27405A;--btn:#FEC50C;--btn-ink:#10243E}}
:root[data-theme="dark"]{--bg:#0C1827;--ink:#E6EEF6;--muted:#97A9BC;--sky:#2BC3E0;--paper:#16273B;--line:#27405A;--btn:#FEC50C;--btn-ink:#10243E}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:17px;line-height:1.55}
.wrap{max-width:720px;margin:0 auto;padding:0 20px}
header{padding:56px 0 44px}
.sun{display:inline-block;width:14px;height:14px;border-radius:50%;background:var(--sun);margin-right:10px;vertical-align:-1px}
.where{font-size:15px;color:var(--muted);margin:0 0 22px}
h1{font-family:"Unbounded",system-ui,sans-serif;font-weight:700;font-size:clamp(34px,9vw,60px);line-height:1.05;letter-spacing:-.02em;margin:0 0 22px}
.lead{font-size:clamp(19px,4.6vw,24px);line-height:1.4;max-width:28ch;margin:0 0 14px;font-weight:500}
.role{color:var(--muted);max-width:46ch;margin:0}
h2{font-family:"Unbounded",system-ui,sans-serif;font-weight:600;font-size:22px;margin:0 0 18px}
section{padding:26px 0}
.receipt{background:var(--paper);border-radius:6px;padding:26px 22px 30px;font-family:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;font-size:14.5px;position:relative;box-shadow:0 1px 0 var(--line),0 14px 30px rgba(16,36,62,.10);max-width:560px;margin:0 auto 0 0}
.receipt::after{content:"";position:absolute;left:0;right:0;bottom:-8px;height:8px;background:linear-gradient(135deg,var(--paper) 50%,transparent 50%) 0 0/16px 8px,linear-gradient(225deg,var(--paper) 50%,transparent 50%) 0 0/16px 8px}
.rh{text-align:center;margin:0 0 14px;padding-bottom:12px;border-bottom:2px dashed var(--line)}
.rh b{display:block;font-weight:500;font-size:16px}
.rh span{color:var(--muted);font-size:13px}
.item{display:grid;gap:2px;padding:9px 0;border-bottom:1px dashed var(--line)}
.item b{font-weight:500}
.item span{color:var(--muted);font-size:13.5px}
.tot{display:flex;justify-content:space-between;gap:12px;margin-top:16px;font-weight:500;font-size:15px}
.about p{max-width:52ch;margin:0 0 14px}
.facts{display:grid;gap:10px;margin:22px 0 0;padding:0;list-style:none}
.facts li{padding-left:18px;position:relative}
.facts li::before{content:"";position:absolute;left:0;top:.7em;width:8px;height:8px;border-radius:50%;background:var(--sky)}
.btns{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
.btn{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px;border-radius:14px;background:var(--btn);color:var(--btn-ink);text-decoration:none;font-weight:600;min-height:56px}
.btn small{font-weight:400;opacity:.8;font-size:14px;overflow-wrap:anywhere;text-align:right}
.btn:hover{filter:brightness(1.1)}
.btn:focus-visible,a:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.save{display:flex;gap:22px;align-items:center;margin-top:28px;background:var(--paper);border:1px solid var(--line);border-radius:16px;padding:20px;flex-wrap:wrap}
.qr{width:140px;height:140px;background:#fff;padding:8px;border-radius:10px;flex:none}
.qr svg{width:100%;height:100%;display:block}
.save p{margin:0;max-width:30ch}
.save b{display:block;font-size:18px;margin-bottom:4px}
.save span{color:var(--muted);font-size:15px}
footer{padding:30px 0 56px;color:var(--muted);font-size:14px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <p class="where"><span class="sun"></span>Тараз, Казахстан · готов к переезду в Алматы</p>
    <h1>Джахангир Туганбай</h1>
    <p class="lead">Превращаю выгрузки из 1С в отчёты, которые обновляются сами.</p>
    <p class="role">Руководитель отдела по управлению базой данных и аналитики, «Вкусная корзинка».</p>
  </header>

  <section>
    <h2>Что я делаю</h2>
    <div class="receipt">
      <div class="rh"><b>Вкусная корзинка</b><span>отчёты для розницы</span></div>
      <div
